services:
  frontend:
    build:
      context: .
      args:
        VITE_TRPG_API_URL: ${VITE_TRPG_API_URL:-https://api.arnaud-a.dev}
    container_name: trpg-frontend-app
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - web

networks:
  web:
    external: true
    name: web
